<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Neonómina - Frontend (Hola Mundo)</title>
</head>
<body>
  <h1>Neonómina — Frontend</h1>
  <p id="msg">Presiona el botón para consultar el backend.</p>
  <button id="btn">Consultar backend</button>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/hello');
        const data = await res.json();
        document.getElementById('msg').innerText = JSON.stringify(data);
      } catch (err) {
        document.getElementById('msg').innerText = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
